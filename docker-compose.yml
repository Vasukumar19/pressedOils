services:
  postgres:
    image: postgres:16-alpine
    container_name: pressedoils-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pressedoils
      POSTGRES_PASSWORD: pressedoils_dev_password
      POSTGRES_DB: pressedoils
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pressedoils -d pressedoils']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pressedoils-redis
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'volatile-lru']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
