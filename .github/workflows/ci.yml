name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PNPM_VERSION: '12.3.4'
  NODE_VERSION: '22'

jobs:
  ci:
    name: DB · Lint · Type-check · Test · Audit · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for temporary CI test database only — never production secrets.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: pressedoils_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-queue:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout (full history for migration upgrade check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @pressedoils/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Migrate empty database & verify no schema drift
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public
        run: |
          pnpm --filter @pressedoils/api db:migrate
          pnpm --filter @pressedoils/api db:status
          pnpm --filter @pressedoils/api db:diff

      - name: Verify upgrade migration path from previous release
        run: |
          BASE_URL="postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public"
          echo "CREATE DATABASE pressedoils_upgrade;" | pnpm --filter @pressedoils/api exec prisma db execute --stdin --url="$BASE_URL"

          PREV_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            PREV_REF="origin/${{ github.base_ref }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV_REF="HEAD~1"
          fi

          UPGRADE_URL="postgresql://ci_user:ci_password@localhost:5432/pressedoils_upgrade?schema=public"
          if [ -n "$PREV_REF" ] && git cat-file -e "${PREV_REF}:apps/api/prisma/migrations" 2>/dev/null; then
            mkdir -p /tmp/prev-prisma
            git show "${PREV_REF}:apps/api/prisma/schema.prisma" > /tmp/prev-prisma/schema.prisma
            git archive "$PREV_REF" apps/api/prisma/migrations | tar -x -C /tmp/prev-prisma --strip-components=3
            DATABASE_URL="$UPGRADE_URL" pnpm --filter @pressedoils/api exec prisma migrate deploy --schema=/tmp/prev-prisma/schema.prisma
            rm -rf /tmp/prev-prisma
          else
            echo "No prior migrations in $PREV_REF — applying current migrations as initial release."
          fi

          DATABASE_URL="$UPGRADE_URL" pnpm --filter @pressedoils/api db:migrate
          DATABASE_URL="$UPGRADE_URL" pnpm --filter @pressedoils/api db:diff

      - name: Run seed:dev twice to prove repeatability
        env:
          NODE_ENV: development
          APP_ENV: development
          IS_PRODUCTION_DB: 'false'
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public
        run: |
          pnpm db:seed:dev
          pnpm db:seed:dev

      - name: Verify bootstrap:prod & check:no-placeholders on clean DB
        run: |
          BASE_URL="postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public"
          echo "CREATE DATABASE pressedoils_prod_check;" | pnpm --filter @pressedoils/api exec prisma db execute --stdin --url="$BASE_URL"
          PROD_CHECK_URL="postgresql://ci_user:ci_password@localhost:5432/pressedoils_prod_check?schema=public"
          DATABASE_URL="$PROD_CHECK_URL" pnpm --filter @pressedoils/api db:migrate
          DATABASE_URL="$PROD_CHECK_URL" BOOTSTRAP_ADMIN_EMAIL="ci-owner@example.invalid" pnpm db:bootstrap:prod
          DATABASE_URL="$PROD_CHECK_URL" pnpm check:no-placeholders

      - name: Unit tests
        run: pnpm test:ci

      - name: Integration & E2E tests (PostgreSQL + Redis)
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public
          REDIS_URL: redis://localhost:6379
          QUEUE_REDIS_URL: redis://localhost:6380
          ENABLE_TEMP_ADMIN_API: 'true'
        run: pnpm --filter @pressedoils/api test:integration

      - name: Verify OpenAPI spec matches committed file
        run: |
          pnpm --filter @pressedoils/api openapi:generate
          git diff --exit-code apps/api/openapi.json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: apps/api/openapi.json
          retention-days: 30

      - name: Dependency audit
        run: |
          pnpm audit --prod --audit-level=critical
          pnpm audit --audit-level=high || echo "Non-blocking dev/transitive advisories logged above"

      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source="/repo" --verbose --redact

      - name: Production build
        env:
          APP_ENV: production
          IS_PRODUCTION_DB: 'true'
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/pressedoils_ci?schema=public
          REDIS_URL: redis://localhost:6379
        run: pnpm build
